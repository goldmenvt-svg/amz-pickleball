name: Video Discovery Scan

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: videos-json-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run quality tests
        run: node scripts/video-discover.quality.test.js

      - name: Run video discovery
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/video-discover.js

      - name: Commit and push new videos
        run: |
          git config user.name "AMZ Video Bot"
          git config user.email "bot@amzpickleball.vn"
          git add data/videos.json
          git diff --staged --quiet || git commit -m "chore: auto-discover videos $(date +%Y-%m-%d-%H%M)"
          git push
